name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the release job may write (create the release,
# sign attestations).
permissions:
  contents: read

# Release builds never restore or save the Go module/build cache, so a cache
# written by another workflow cannot end up in a published binary.

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      geoip_sha256: ${{ steps.geo.outputs.geoip_sha256 }}
      geosite_sha256: ${{ steps.geo.outputs.geosite_sha256 }}
      asn_sha256: ${{ steps.geo.outputs.asn_sha256 }}
      geo_fetched_at: ${{ steps.geo.outputs.fetched_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the previous release tag, for the helper check; main, for the branch check

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # Installed helpers are replaced only when their version differs, so
      # a release whose helper changed must bump cmd/lanflow-helper/VERSION.
      - name: Require a helper version bump when the helper changed
        run: scripts/check-helper-version.sh "${GITHUB_REF_NAME}"

      - name: Require the update signing key
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "${MYGO_UPDATER_PRIVATE_KEY}" ]; then
            echo "secret MYGO_UPDATER_PRIVATE_KEY is not set: installed apps could not update to this release" >&2
            exit 1
          fi

      - name: Require tag to match mygo.json version
        run: |
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' mygo.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match mygo.json version ${version}" >&2
            exit 1
          fi
          if ! grep -q "const appVersion = \"${version}\"" internal/view/settings/page.go; then
            echo "internal/view/settings/page.go appVersion does not match ${version}" >&2
            exit 1
          fi

      # A release is cut from main only: a tag on a commit main does not
      # contain (a feature branch, a commit that was rebased away) stops here.
      - name: Require the tagged commit on main
        run: |
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || {
            echo "origin/main was not fetched; cannot tell whether ${GITHUB_REF_NAME} is on main" >&2
            exit 1
          }
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main" >&2
            exit 1
          fi

      # meta-rules-dat publishes only a rolling "latest" that is replaced
      # daily, so the geo databases are fetched once, here, and both build
      # jobs pack these very files: fetch-core.sh finds them in bin/geo/ and
      # checks them against the sums below (GEOIP_SHA256 and the others)
      # instead of asking for "latest" again. The sums go into the release
      # notes and a release asset, so what a release shipped stays on record.
      - name: Fetch geodata for both platforms
        id: geo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/fetch-core.sh
          for pair in geoip:geoip.metadb geosite:geosite.dat asn:GeoLite2-ASN.mmdb; do
            sum="$(sha256sum "bin/geo/${pair#*:}" | cut -d' ' -f1)"
            echo "${pair%%:*}_sha256=${sum}" >> "$GITHUB_OUTPUT"
            echo "${sum}  ${pair#*:}"
          done
          echo "fetched_at=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geodata
          path: |
            bin/geo/geoip.metadb
            bin/geo/geosite.dat
            bin/geo/GeoLite2-ASN.mmdb
          if-no-files-found: error
          retention-days: 7 # long enough to re-run a failed build job

  # Runs in parallel with build-macos and build-windows while gating the final
  # release job: a tag pushed right after merging to main builds installers
  # concurrently with CI instead of waiting serially for CI to finish first.
  wait-ci:
    name: Require CI run
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read # the CI runs of the tagged commit
    steps:
      # The full set of checks (vet, mygo vet, unit tests with -race,
      # staticcheck, govulncheck, cross builds) is the CI workflow's: the
      # tagged commit must have a successful CI run, from the push to main or
      # started by hand (workflow_dispatch) on the tag. Pull request runs do
      # not count (their workflow file is the pull request's own).
      - name: Require a successful CI run of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 45 * 60))
          empty=0
          while :; do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | {id, event, status, conclusion, html_url}]')"
            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI succeeded for ${GITHUB_SHA}:"
              jq -r '.[] | select(.conclusion == "success") | .html_url' <<<"$runs"
              exit 0
            fi
            if jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
              echo "CI is still running for ${GITHUB_SHA}; waiting"
            elif [ "$(jq length <<<"$runs")" = 0 ] && [ "$empty" -lt 6 ]; then
              # The tag may arrive together with the push to main, before
              # the CI run is listed.
              empty=$((empty + 1))
              echo "no CI run for ${GITHUB_SHA} yet; waiting"
            else
              echo "no successful CI run for ${GITHUB_SHA}; a release needs one (run the CI workflow on the tag, then re-run this job):" >&2
              jq -r '.[] | "\(.html_url)  \(.event)  \(.status)  \(.conclusion)"' <<<"$runs" >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "CI did not finish within 45 minutes" >&2
              exit 1
            fi
            sleep 30
          done

  build-macos:
    name: Build macOS
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GEOIP_SHA256: ${{ needs.validate.outputs.geoip_sha256 }}
      GEOSITE_SHA256: ${{ needs.validate.outputs.geosite_sha256 }}
      ASN_SHA256: ${{ needs.validate.outputs.asn_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # The geo databases the validate job fetched, the same for every platform.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: geodata
          path: bin/geo

      # fetch-core.sh checks the core against its pinned SHA-256 and the
      # geodata above against the sums from the validate job (it downloads
      # nothing that is already there and matches), and writes
      # bin/<goos>-<goarch>/; prepare-resources.sh copies from there.
      - name: Prepare resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/prepare-resources.sh darwin arm64
          scripts/prepare-resources.sh darwin amd64

      # After the resources: bin/mihomo and bin/geo/ are there now, so the
      # packages that exercise the real core and geodata run against the exact
      # files that ship. Vet, staticcheck, race detector, and the pure unit/UI
      # tests are verified by CI on this exact commit (gated by wait-ci).
      - name: Test bundled core and geodata
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/core ./internal/controller ./internal/locate ./internal/profile ./internal/capture/agent ./internal/app

      # No Developer ID: mygo signs ad hoc ("-"), which Apple Silicon requires to run at all.
      # One platform per build: build-app.sh links in that platform's
      # helper version and SHA-256 (bin/<plat>/app-ldflags from prepare-resources.sh).
      # MYGO_UPDATER_PRIVATE_KEY signs the update archives and manifests
      # (docs/updates.md of mygo); GH_TOKEN lets mygo read the published
      # releases for delta updates.
      - name: Build app and disk images
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/build-app.sh darwin arm64
          scripts/build-app.sh darwin amd64

      # The helper inside each bundle must be the exact file whose SHA-256
      # was linked into the app, or TUN install refuses it.
      - name: Check bundled helper hash
        run: |
          for arch in arm64 amd64; do
            want="$(sed -n 's/.*ExpectedHelperSHA256=\([0-9a-f]*\).*/\1/p' "bin/darwin-${arch}/app-ldflags")"
            got="$(shasum -a 256 build/darwin-${arch}/*.app/Contents/Resources/lanflow-helper | cut -d' ' -f1)"
            echo "darwin/${arch}: linked ${want}, bundled ${got}"
            [ -n "$want" ] && [ "$want" = "$got" ]
          done

      # Every bundle carries the geo databases of the validate job and the
      # license material (Mihomo is GPL-3.0: its license and where its
      # source is ship with it).
      - name: Check bundled geodata and licenses
        run: |
          for arch in arm64 amd64; do
            res="$(echo build/darwin-${arch}/*.app/Contents/Resources)"
            for pair in "${GEOIP_SHA256}:geoip.metadb" "${GEOSITE_SHA256}:geosite.dat" "${ASN_SHA256}:GeoLite2-ASN.mmdb"; do
              want="${pair%%:*}"; f="${pair#*:}"
              got="$(shasum -a 256 "${res}/geo/${f}" | cut -d' ' -f1)"
              echo "darwin/${arch} ${f}: expected ${want}, bundled ${got}"
              [ -n "$want" ] && [ "$want" = "$got" ]
            done
            for f in mihomo/LICENSE mihomo/SOURCE.txt geodata/NOTICE.txt THIRD-PARTY-NOTICES.md go/go/LICENSE; do
              [ -s "${res}/licenses/${f}" ] || { echo "darwin/${arch}: licenses/${f} is not in the bundle" >&2; exit 1; }
            done
          done

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/darwin-arm64/*.dmg build/darwin-amd64/*.dmg dist/
          mkdir -p dist/updates
          for d in build/darwin-arm64 build/darwin-amd64; do
            cp "$d"/*.tar.gz "$d"/update-*.json dist/updates/
            cp "$d"/*.delta dist/updates/ 2>/dev/null || true
          done
          go version -m build resources > dist/lanflow-macos-buildinfo.txt
          { echo; echo "geodata (sha256):"; (cd resources/geo && shasum -a 256 -- *); } >> dist/lanflow-macos-buildinfo.txt
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lanflow-macos
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GEOIP_SHA256: ${{ needs.validate.outputs.geoip_sha256 }}
      GEOSITE_SHA256: ${{ needs.validate.outputs.geosite_sha256 }}
      ASN_SHA256: ${{ needs.validate.outputs.asn_sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Windows Defender exclusions
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:USERPROFILE, $env:LOCALAPPDATA, "C:\hostedtoolcache") | Where-Object { $_ }
          foreach ($p in $paths) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch { Write-Host "Skipped Defender exclusion for ${p}: $_" }
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # The geo databases the validate job fetched, the same for every platform.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: geodata
          path: bin/geo

      - name: Prepare resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/prepare-resources.sh windows amd64

      # What goes into the installer: the geo databases of the validate job
      # and the license material.
      - name: Check geodata and licenses to bundle
        run: |
          for pair in "${GEOIP_SHA256}:geoip.metadb" "${GEOSITE_SHA256}:geosite.dat" "${ASN_SHA256}:GeoLite2-ASN.mmdb"; do
            want="${pair%%:*}"; f="${pair#*:}"
            got="$(sha256sum "resources/geo/${f}" | cut -d' ' -f1)"
            echo "${f}: expected ${want}, to bundle ${got}"
            [ -n "$want" ] && [ "$want" = "$got" ]
          done
          for f in mihomo/LICENSE mihomo/SOURCE.txt geodata/NOTICE.txt THIRD-PARTY-NOTICES.md go/go/LICENSE; do
            [ -s "resources/windows-amd64/licenses/${f}" ] || { echo "licenses/${f} was not prepared" >&2; exit 1; }
          done

      # After the resources, as on macOS: the packages that exercise the real
      # core and geodata run against the exact files that ship.
      - name: Test bundled core and geodata
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/core ./internal/controller ./internal/locate ./internal/profile ./internal/capture/agent ./internal/app

      # mygo uses a makensis it finds (PATH or Program Files\NSIS, which the
      # runner image provides) and otherwise downloads NSIS 3.13 and checks
      # it against the SHA-256 pinned in mygo itself. Log which one is used.
      - name: Show NSIS
        run: |
          if command -v makensis >/dev/null 2>&1; then makensis -VERSION; echo
          elif [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then "/c/Program Files (x86)/NSIS/makensis.exe" -VERSION; echo
          else echo "no NSIS on the runner; mygo downloads its pinned NSIS"; fi

      - name: Build app and installer
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-app.sh windows amd64

      - name: Check bundled helper hash
        run: |
          want="$(sed -n 's/.*ExpectedHelperSHA256=\([0-9a-f]*\).*/\1/p' "bin/windows-amd64/app-ldflags")"
          got="$(sha256sum "resources/windows-amd64/lanflow-helper.exe" | cut -d' ' -f1)"
          echo "windows/amd64: linked ${want}, bundled ${got}"
          [ -n "$want" ] && [ "$want" = "$got" ]

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find build -maxdepth 2 -name '*-setup-*.exe' -exec cp {} dist/ \;
          mkdir -p dist/updates
          find build -maxdepth 2 \( -name '*.tar.gz' -o -name '*.delta' -o -name 'update-*.json' \) -exec cp {} dist/updates/ \;
          ls dist/updates/update-windows-*.json >/dev/null
          ls dist/*-setup-*.exe >/dev/null
          go version -m build resources > dist/lanflow-windows-buildinfo.txt
          { echo; echo "geodata (sha256):"; (cd resources/geo && sha256sum -- *); } >> dist/lanflow-windows-buildinfo.txt
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lanflow-windows
          path: dist/*
          if-no-files-found: error

  # The Android APK (arm64), signed with the release key: a phone installs
  # an update only when it is signed by the key of the installed app, so
  # every release must use the same one. The keystore is the repository
  # secret ANDROID_KEYSTORE_BASE64 (base64 of the .jks) with its password in
  # ANDROID_KEYSTORE_PASSWORD (and ANDROID_KEY_PASSWORD when the key's
  # differs); the alias is the variable ANDROID_KEY_ALIAS (default lanflow),
  # and the variable ANDROID_CERT_SHA256, when set, is the certificate the
  # APK must be signed by. Without the keystore the release goes out without
  # an APK (a warning says so) rather than with one signed by a runner's
  # debug key, which no later release could update.
  # Linux needs no cgo (MyGo loads GTK at run time), so one runner builds
  # both architectures; the bundled-core tests run on this runner's amd64.
  build-linux:
    name: Build Linux
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GEOIP_SHA256: ${{ needs.validate.outputs.geoip_sha256 }}
      GEOSITE_SHA256: ${{ needs.validate.outputs.geosite_sha256 }}
      ASN_SHA256: ${{ needs.validate.outputs.asn_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: geodata
          path: bin/geo

      - name: Prepare resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/prepare-resources.sh linux amd64
          scripts/prepare-resources.sh linux arm64

      - name: Test bundled core and geodata
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/core ./internal/controller ./internal/locate ./internal/profile ./internal/capture/agent ./internal/app

      # The Debian and RPM packages (in /opt/lanflow) and the archive that
      # install.sh installs into ~/.local and updates from; with
      # MYGO_UPDATER_PRIVATE_KEY also its signed manifest and deltas.
      - name: Build packages
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/build-app.sh linux amd64
          scripts/build-app.sh linux arm64

      - name: Check bundled helper, geodata and licenses
        run: |
          for arch in amd64 arm64; do
            d="build/linux-${arch}"
            want="$(sed -n 's/.*ExpectedHelperSHA256=\([0-9a-f]*\).*/\1/p' "bin/linux-${arch}/app-ldflags")"
            got="$(sha256sum "${d}/lanflow-helper" | cut -d' ' -f1)"
            echo "linux/${arch} helper: linked ${want}, bundled ${got}"
            [ -n "$want" ] && [ "$want" = "$got" ]
            tar tzf "${d}/lanflow-"*"-linux-${arch}.tar.gz" | grep -qx mihomo || { echo "linux/${arch}: no mihomo in the archive" >&2; exit 1; }
            for pair in "${GEOIP_SHA256}:geoip.metadb" "${GEOSITE_SHA256}:geosite.dat" "${ASN_SHA256}:GeoLite2-ASN.mmdb"; do
              want="${pair%%:*}"; f="${pair#*:}"
              got="$(sha256sum "${d}/geo/${f}" | cut -d' ' -f1)"
              echo "linux/${arch} ${f}: expected ${want}, bundled ${got}"
              [ -n "$want" ] && [ "$want" = "$got" ]
            done
            for f in mihomo/LICENSE mihomo/SOURCE.txt geodata/NOTICE.txt THIRD-PARTY-NOTICES.md go/go/LICENSE; do
              [ -s "${d}/licenses/${f}" ] || { echo "linux/${arch}: licenses/${f} is not in the package" >&2; exit 1; }
            done
          done

      # install.sh is the same for every architecture (it picks the
      # archive by uname -m), so one copy goes up.
      - name: Collect artifacts
        run: |
          mkdir -p dist/updates
          for arch in amd64 arm64; do
            d="build/linux-${arch}"
            cp "$d"/*.deb "$d"/*.rpm dist/
            cp "$d"/*.tar.gz "$d"/update-*.json dist/updates/
            cp "$d"/*.delta dist/updates/ 2>/dev/null || true
          done
          cp build/linux-amd64/install.sh dist/
          cmp build/linux-amd64/install.sh build/linux-arm64/install.sh
          go version -m build resources > dist/lanflow-linux-buildinfo.txt
          { echo; echo "geodata (sha256):"; (cd resources/geo && sha256sum -- *); } >> dist/lanflow-linux-buildinfo.txt
          ls -la dist dist/updates

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lanflow-linux
          path: dist/*
          if-no-files-found: error

  build-android:
    name: Build Android
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check for the signing key
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::warning title=No Android APK::secret ANDROID_KEYSTORE_BASE64 is not set: this release has no Android APK (docs/phone-android.md, 发布)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.key.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: false

      - name: Android SDK packages
        if: steps.key.outputs.present == 'true'
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"

      - name: Build and sign APK
        if: steps.key.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MYGO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYGO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LANFLOW_ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'lanflow' }}
          LANFLOW_ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          export LANFLOW_ANDROID_KEYSTORE="${RUNNER_TEMP}/release.jks"
          base64 -d <<<"${ANDROID_KEYSTORE_BASE64}" > "${LANFLOW_ANDROID_KEYSTORE}"
          trap 'rm -f "${LANFLOW_ANDROID_KEYSTORE}"' EXIT
          scripts/build-android.sh

      - name: Collect artifacts
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p dist
          cp build/android/lanflow-*-android-arm64.apk dist/
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.present == 'true'
        with:
          name: lanflow-android
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [validate, wait-ci, build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write     # create the release and upload assets
      id-token: write     # OIDC token for the Sigstore signature
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lanflow-* # the installers and update files, not the geodata artifact
          path: artifacts
          merge-multiple: true

      # SPDX SBOM of the Go module graph the release was built from.
      - name: Generate SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: src
          format: spdx-json
          output-file: artifacts/lanflow-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # The update manifests go up last (below): an app that reads one finds
      # every file it names already there.
      - name: Separate update manifests
        run: |
          mv artifacts/updates/update-*.json .
          mv artifacts/updates/* artifacts/
          rmdir artifacts/updates
          ls update-darwin-arm64.json update-darwin-amd64.json update-windows-amd64.json update-linux-amd64.json update-linux-arm64.json

      # The release page carries only what a person downloads (installers)
      # and what installed apps download (update packages, manifests), plus
      # SHA256SUMS.txt. The build records (SBOM, `go version -m` of every
      # binary, the geodata SHA-256) stay with this run as an artifact; the
      # third-party notices are linked at the tag and ship in every package.
      - name: Keep build records off the release page
        env:
          GEOIP_SHA256: ${{ needs.validate.outputs.geoip_sha256 }}
          GEOSITE_SHA256: ${{ needs.validate.outputs.geosite_sha256 }}
          ASN_SHA256: ${{ needs.validate.outputs.asn_sha256 }}
        run: |
          mkdir -p records
          mv artifacts/*-buildinfo.txt artifacts/*.spdx.json records/
          geo="records/lanflow-${GITHUB_REF_NAME}-geodata.sha256"
          {
            echo "${GEOIP_SHA256}  geoip.metadb"
            echo "${GEOSITE_SHA256}  geosite.dat"
            echo "${ASN_SHA256}  GeoLite2-ASN.mmdb"
          } > "$geo"
          grep -c -E '^[0-9a-f]{64}  ' "$geo" | grep -qx 3
          ls -l records

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-records
          path: records/*
          if-no-files-found: error
          retention-days: 90

      # The head of the release notes: which file to download on which
      # device, then what ships besides Lanflow itself (Mihomo's GPL-3.0 and
      # its source, and the SHA-256 of the geo databases packed into every
      # package: they come from a rolling upstream release, so the tag alone
      # would not say which files they were).
      - name: Write release notes
        env:
          GEO_FETCHED_AT: ${{ needs.validate.outputs.geo_fetched_at }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          repo="https://github.com/${GITHUB_REPOSITORY}"
          core="$(sed -n 's/^PINNED_VERSION="\([^"]*\)".*/\1/p' src/scripts/fetch-core.sh)"
          [ -n "$core" ]
          for f in "lanflow-${ver}-arm64.dmg" "lanflow-${ver}-amd64.dmg" "lanflow-setup-${ver}-amd64.exe" \
            "lanflow_${ver}_amd64.deb" "lanflow-${ver}-1.x86_64.rpm" "lanflow_${ver}_arm64.deb" "lanflow-${ver}-1.aarch64.rpm" install.sh; do
            [ -s "artifacts/$f" ] || { echo "missing artifacts/$f" >&2; exit 1; }
          done
          apk="lanflow-${ver}-android-arm64.apk"
          dl="${repo}/releases/download/${GITHUB_REF_NAME}"
          {
            echo "### 下载哪个文件"
            echo
            echo "| 设备 | 系统要求 | 下载 |"
            echo "|---|---|---|"
            echo "| Mac（Apple 芯片：M1 及以后） | macOS 12 及以上 | [\`lanflow-${ver}-arm64.dmg\`](${repo}/releases/download/${GITHUB_REF_NAME}/lanflow-${ver}-arm64.dmg) |"
            echo "| Mac（Intel 处理器） | macOS 12 及以上 | [\`lanflow-${ver}-amd64.dmg\`](${repo}/releases/download/${GITHUB_REF_NAME}/lanflow-${ver}-amd64.dmg) |"
            echo "| Windows 电脑（64 位） | Windows 10 / 11 | [\`lanflow-setup-${ver}-amd64.exe\`](${repo}/releases/download/${GITHUB_REF_NAME}/lanflow-setup-${ver}-amd64.exe) |"
            echo "| Linux 电脑（x64） | Ubuntu、Debian 选 .deb；Fedora、openSUSE 选 .rpm | [\`.deb\`](${dl}/lanflow_${ver}_amd64.deb) · [\`.rpm\`](${dl}/lanflow-${ver}-1.x86_64.rpm) |"
            echo "| Linux 电脑（arm64） | 同上 | [\`.deb\`](${dl}/lanflow_${ver}_arm64.deb) · [\`.rpm\`](${dl}/lanflow-${ver}-1.aarch64.rpm) |"
            if [ -s "artifacts/$apk" ]; then
              echo "| 安卓手机、平板（arm64） | Android 10 及以上 | [\`${apk}\`](${repo}/releases/download/${GITHUB_REF_NAME}/${apk}) |"
            fi
            echo
            echo "- 不确定 Mac 是哪种芯片：点左上角苹果菜单 › 关于本机，「芯片」写着 Apple M… 选第一行，「处理器」写着 Intel 选第二行。"
            echo "- 安装包没有经过 Apple / 微软签名，第一次打开会被系统拦截，放行方法见 [安装说明](${repo}#安装)。"
            echo "- Linux 也可以不用 root、装到自己的用户目录：\`curl -fsSL ${repo}/releases/latest/download/install.sh | sh\`。这样装的会在应用内自动更新；.deb / .rpm 装的不会，新版本下载后重新安装。Linux 版目前只能设置 GNOME 的系统代理，TUN 模式还不支持；托盘图标需要 AppIndicator（GNOME 要装 AppIndicator 扩展）。"
            if [ -s "artifacts/$apk" ]; then
              echo "- 安卓版不会在应用内提示更新，新版本下载后直接覆盖安装，设置和订阅都会保留。"
            fi
            echo "- 其余附件不用手动下载：\`.tar.gz\`、\`.delta\`、\`update-*.json\` 是已安装的桌面版自动更新和 Linux 安装脚本用的；\`SHA256SUMS.txt\` 用来[校验下载](${repo}#验证下载)。"
            echo
            echo "<details><summary>随包组件</summary>"
            echo
            echo "- Mihomo ${core}（GPL-3.0，[对应源代码](https://github.com/MetaCubeX/mihomo/tree/${core})）；其余第三方组件见 [THIRD-PARTY-NOTICES.md](${repo}/blob/${GITHUB_REF_NAME}/THIRD-PARTY-NOTICES.md) 与安装包内的 \`licenses/\`。"
            echo "- 地理数据库取自 MetaCubeX/meta-rules-dat 的 \`latest\`（${GEO_FETCHED_AT}），各平台安装包内为同一份，SHA-256："
            echo
            echo '```'
            cat "records/lanflow-${GITHUB_REF_NAME}-geodata.sha256"
            echo '```'
            echo
            echo "</details>"
            echo
          } > release-body.md
          cat release-body.md

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: 澜流 Lanflow ${{ github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body_path: release-body.md # the generated notes follow it
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Installed apps read update-<platform>.json of the latest release
      # (mygo.json "updates"); publishing them makes the update live.
      - name: Publish update manifests
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: update-*.json
          fail_on_unmatched_files: true
